name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  zig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Run checker
        run: zig build run -- check src --format json --out reports/apexgov.json

      - name: Run profiler
        run: zig build run -- profile src --format json --out reports/profile.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexgov-reports
          path: reports/
